<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dossier Viewer — Riovic Matthew G. Susas</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- marked.js: lightweight MD → HTML parser (CDN, ~50KB) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <!-- highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- mermaid.js for interactive diagrams -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════════ */
    :root {
      --prussian:  #18334B;
      --hunter:    #566746;
      --isabelline:#C9B79F;
      --linen:     #FAEEE5;
      --bg:        #0f2234;
      --card:      rgba(255,255,255,0.045);
      --border:    rgba(201,183,159,0.18);
      --text:      #e8ddd4;
      --muted:     rgba(232,221,212,0.55);
      --gold:      #E5C378;
      --radius:    12px;
    }

    /* ═══════════════════════════════════════════
       BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
    }

    /* ═══════════════════════════════════════════
       TOP BAR
    ═══════════════════════════════════════════ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 34, 52, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 32px;
      height: 56px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--isabelline);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .back-btn:hover { background: var(--card); border-color: var(--isabelline); color: var(--linen); }
    .back-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    .topbar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 340px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Print / PDF button — the star of the show */
    .btn-print {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
      background: linear-gradient(135deg, var(--hunter) 0%, #3e5232 100%);
      color: var(--linen);
      box-shadow: 0 2px 12px rgba(86,103,70,0.4);
      letter-spacing: 0.01em;
    }
    .btn-print:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(86,103,70,0.55);
      background: linear-gradient(135deg, #64785a 0%, var(--hunter) 100%);
    }
    .btn-print:active { transform: translateY(0); }
    .btn-print svg { width: 15px; height: 15px; }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-copy:hover { border-color: var(--isabelline); color: var(--linen); background: var(--card); }
    .btn-copy svg { width: 13px; height: 13px; }

    /* ═══════════════════════════════════════════
       LOADING STATE
    ═══════════════════════════════════════════ */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 60vh;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--hunter);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════════════════════════════════════
       MAIN DOCUMENT AREA
    ═══════════════════════════════════════════ */
    .viewer-main {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 36px;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 36px 32px 96px 32px;
      box-sizing: border-box;
      min-height: calc(100vh - 56px);
    }

    .doc-wrap {
      flex: 1 1 0;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    /* Document meta header */
    .doc-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .doc-meta-left {}
    .doc-domain-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(86,103,70,0.25);
      color: #a3b896;
      border: 1px solid rgba(86,103,70,0.4);
      margin-bottom: 10px;
    }
    .doc-filename {
      font-size: 11px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 6px;
    }
    .doc-date {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ═══════════════════════════════════════════
       MARKDOWN CONTENT STYLES
    ═══════════════════════════════════════════ */
    .md-body { color: var(--text); }

    .md-body h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--linen);
      line-height: 1.25;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }
    .md-body h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--isabelline);
      margin: 36px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.005em;
    }
    .md-body h3 {
      font-size: 15px;
      font-weight: 700;
      color: #c4b89a;
      margin: 24px 0 10px;
    }
    .md-body h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 20px 0 8px;
    }

    .md-body p {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 14px;
      color: var(--text);
    }

    .md-body a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(229,195,120,0.3);
      transition: border-color 0.15s;
    }
    .md-body a:hover { border-bottom-color: var(--gold); }

    .md-body strong { color: var(--linen); font-weight: 700; }
    .md-body em { color: var(--isabelline); font-style: italic; }

    /* Inline code */
    .md-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: rgba(201,183,159,0.1);
      border: 1px solid rgba(201,183,159,0.2);
      border-radius: 4px;
      padding: 1px 6px;
      color: #c4b89a;
    }

    /* Code blocks */
    .md-body pre {
      max-width: 100%;
      background: #0d1e2d;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      overflow-x: auto;
      margin: 16px 0 20px;
      position: relative;
    }
    .md-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 12.5px;
      color: inherit;
      border-radius: 0;
    }

    /* Tables */
    .md-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 24px;
      font-size: 13px;
    }
    .md-body th {
      background: rgba(86,103,70,0.2);
      color: var(--isabelline);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(201,183,159,0.3);
    }
    .md-body td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
      line-height: 1.6;
    }
    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:hover td { background: rgba(255,255,255,0.025); }

    /* Blockquotes — GitHub-style alerts */
    .md-body blockquote {
      border-left: 3px solid var(--hunter);
      background: rgba(86,103,70,0.08);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px 20px;
      margin: 16px 0 20px;
      color: var(--muted);
      font-size: 13.5px;
    }
    .md-body blockquote p { margin-bottom: 6px; color: var(--muted); }
    .md-body blockquote p:last-child { margin-bottom: 0; }
    .md-body blockquote strong { color: var(--isabelline); }

    /* Alert variants */
    .md-body blockquote.alert-caution { border-color: #e05252; background: rgba(224,82,82,0.07); }
    .md-body blockquote.alert-warning { border-color: #d4a827; background: rgba(212,168,39,0.07); }
    .md-body blockquote.alert-important { border-color: var(--gold); background: rgba(229,195,120,0.07); }
    .md-body blockquote.alert-tip { border-color: #4caf50; background: rgba(76,175,80,0.07); }

    /* Lists */
    .md-body ul, .md-body ol {
      padding-left: 24px;
      margin-bottom: 16px;
    }
    .md-body li {
      font-size: 14px;
      line-height: 1.75;
      margin-bottom: 4px;
      color: var(--text);
    }
    .md-body li strong { color: var(--linen); }

    /* Horizontal rule */
    .md-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    /* Fenced metadata block (the ``` at top of dossiers) */
    .md-body pre.meta-block {
      background: rgba(24, 51, 75, 0.6);
      border-color: rgba(201,183,159,0.3);
    }

    /* Mermaid diagram container */
    .mermaid-wrap {
      margin: 28px 0;
      padding: 24px;
      background: rgba(24, 51, 75, 0.45);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      text-align: center;
    }
    .mermaid {
      display: inline-block;
      min-width: 260px;
      text-align: center;
    }
    .mermaid svg {
      max-width: 100% !important;
      height: auto !important;
    }

    /* ═══════════════════════════════════════════
       TABLE OF CONTENTS SIDEBAR (optional)
    ═══════════════════════════════════════════ */
    .toc-sidebar {
      width: 240px;
      flex-shrink: 0;
      position: sticky;
      top: 76px;
      max-height: calc(100vh - 96px);
      overflow-y: auto;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(24, 51, 75, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      scrollbar-width: thin;
    }
    .toc-sidebar h5 {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .toc-sidebar a {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 0;
      border-left: 2px solid transparent;
      padding-left: 10px;
      margin-left: -10px;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .toc-sidebar a:hover, .toc-sidebar a.active {
      color: var(--isabelline);
      border-left-color: var(--hunter);
    }
    .toc-sidebar a.toc-h3 { font-size: 10.5px; padding-left: 20px; margin-left: -10px; }

    @media (min-width: 1024px) {
      .toc-sidebar { display: block; }
    }
    @media (max-width: 1024px) {
      .viewer-main {
        padding: 24px 16px 80px 16px;
        gap: 0;
      }
    }

    /* ═══════════════════════════════════════════
       ERROR STATE
    ═══════════════════════════════════════════ */
    .error-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 12px;
      text-align: center;
      color: var(--muted);
      padding: 40px;
    }
    .error-state h3 { font-size: 18px; color: var(--isabelline); }
    .error-state p { font-size: 13px; max-width: 400px; line-height: 1.6; }
    .error-state code { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 2px 6px; background: var(--card); border-radius: 4px; }

    /* ═══════════════════════════════════════════
       PRINT / PDF STYLES
       Everything in @media print overrides the
       screen styles — no extra tool needed.
       Ctrl+P / Cmd+P → Save as PDF.
    ═══════════════════════════════════════════ */
    @media print {
      /* Page setup */
      @page {
        size: A4 portrait;
        margin: 18mm 20mm 18mm 20mm;
      }

      /* Reset backgrounds for print */
      *, *::before, *::after {
        background: transparent !important;
        box-shadow: none !important;
        text-shadow: none !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* Hide chrome UI */
      .topbar, .toc-sidebar, .btn-print, .btn-copy, .back-btn { display: none !important; }

      body {
        font-family: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
        font-size: 10pt;
        color: #111 !important;
        background: #fff !important;
        line-height: 1.6;
      }

      .doc-wrap {
        max-width: 100%;
        padding: 0;
        margin: 0;
      }

      /* Print header: name + doc title */
      .print-header {
        display: block !important;
        border-bottom: 2pt solid #18334B;
        padding-bottom: 10pt;
        margin-bottom: 18pt;
      }
      .print-header .print-name {
        font-size: 9pt;
        font-weight: 700;
        color: #18334B;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .print-header .print-doc-title {
        font-size: 7pt;
        color: #666;
        margin-top: 2pt;
      }

      /* Print footer */
      .print-footer {
        display: block !important;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        font-size: 7pt;
        color: #999;
        border-top: 1pt solid #ddd;
        padding-top: 6pt;
        display: flex;
        justify-content: space-between;
      }

      /* Headings */
      .md-body h1 {
        font-size: 18pt;
        color: #18334B !important;
        margin-bottom: 12pt;
        page-break-after: avoid;
      }
      .md-body h2 {
        font-size: 13pt;
        color: #18334B !important;
        border-bottom: 1pt solid #c9b79f;
        margin-top: 20pt;
        page-break-after: avoid;
      }
      .md-body h3 {
        font-size: 11pt;
        color: #333 !important;
        margin-top: 14pt;
        page-break-after: avoid;
      }
      .md-body h4 {
        font-size: 9pt;
        color: #555 !important;
        margin-top: 10pt;
        page-break-after: avoid;
      }

      .md-body p, .md-body li { font-size: 10pt; color: #222 !important; }
      .md-body strong { color: #111 !important; }
      .md-body em { color: #333 !important; }

      /* Tables */
      .md-body table { font-size: 8.5pt; page-break-inside: avoid; }
      .md-body th {
        background: #18334B !important;
        color: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        padding: 5pt 8pt;
      }
      .md-body td { padding: 5pt 8pt; border-bottom: 0.5pt solid #ddd; color: #222 !important; }
      .md-body tr:nth-child(even) td { background: #f9f7f5 !important; }

      /* Code blocks */
      .md-body pre {
        background: #f4f4f4 !important;
        border: 1pt solid #ddd;
        border-radius: 4pt;
        padding: 10pt;
        font-size: 7.5pt;
        page-break-inside: avoid;
        overflow: visible;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .md-body pre code { color: #333 !important; font-size: 7.5pt; }
      .md-body code { color: #566746 !important; background: #f0ede8 !important; border: none; }

      /* Mermaid diagram in print */
      .mermaid-wrap {
        background: #fdfdfd !important;
        border: 1pt solid #ddd !important;
        border-radius: 4pt;
        padding: 12pt;
        margin: 14pt 0;
        page-break-inside: avoid;
      }

      /* Blockquotes */
      .md-body blockquote {
        border-left: 3pt solid #566746;
        background: #f7f5f2 !important;
        padding: 8pt 12pt;
        margin: 10pt 0;
        font-size: 9pt;
        page-break-inside: avoid;
      }
      .md-body blockquote p { color: #444 !important; font-size: 9pt; }
      .md-body blockquote.alert-caution { border-color: #c0392b !important; }
      .md-body blockquote.alert-warning { border-color: #d4a827 !important; }
      .md-body blockquote.alert-important { border-color: #18334B !important; }

      .md-body hr { border-top: 0.5pt solid #ddd; margin: 16pt 0; }

      /* Links: show URL in parens */
      .md-body a::after { content: " (" attr(href) ")"; font-size: 7pt; color: #666; }
      .md-body a[href^="#"]::after { content: ""; } /* skip anchor links */

      /* Avoid orphan headings */
      h1, h2, h3, h4 { page-break-inside: avoid; }
      p, li { orphans: 3; widows: 3; }

      /* Doc meta hidden in print, replaced by print-header */
      .doc-meta { display: none !important; }

      /* Loading / error hidden */
      #loading, .error-state { display: none !important; }
    }

    /* print-header/footer hidden on screen */
    .print-header, .print-footer { display: none; }

    /* ═══════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════ */
    @media (max-width: 640px) {
      .topbar { padding: 0 16px; }
      .topbar-title { display: none; }
      .doc-wrap { padding: 24px 16px 64px; }
      .doc-meta { flex-direction: column; gap: 8px; }
    }
  </style>
  <link rel="stylesheet" href="../css/typography.css" />
</head>
<body>

  <!-- ══════════════════════════════════════
       STICKY TOP BAR
  ══════════════════════════════════════ -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="../projects/" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back to Projects
      </a>
      <span class="topbar-title" id="topbar-title">Loading dossier…</span>
    </div>
    <div class="topbar-actions">
      <button class="btn-copy" id="btn-copy" title="Copy GitHub link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copy Link
      </button>
      <button class="btn-print" id="btn-print" onclick="window.print()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        Save as PDF
      </button>
    </div>
  </header>

  <!-- ══════════════════════════════════════
       PRINT-ONLY HEADER / FOOTER
  ══════════════════════════════════════ -->
  <div class="print-header" id="print-header">
    <div class="print-name">Riovic Matthew G. Susas — Technical Operations Portfolio</div>
    <div class="print-doc-title" id="print-doc-title"></div>
  </div>
  <div class="print-footer">
    <span>Riovic Matthew G. Susas — Synapse Botanicals Case Studies</span>
    <span id="print-url"></span>
  </div>

  <!-- ══════════════════════════════════════
       MAIN CONTENT (FLEX LAYOUT)
  ══════════════════════════════════════ -->
  <main class="viewer-main">
    <!-- Loading -->
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading dossier…</span>
    </div>

    <!-- Error -->
    <div class="error-state" id="error">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C9B79F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <h3>Dossier Not Found</h3>
      <p id="error-msg">No <code>?file=</code> parameter was provided, or the file could not be loaded.</p>
      <p style="margin-top:12px"><a href="../projects/" style="color:var(--gold)">← Return to Projects</a></p>
    </div>

    <!-- Document -->
    <div class="doc-wrap" id="doc-wrap" style="display:none">
      <div class="doc-meta">
        <div class="doc-meta-left">
          <div class="doc-domain-badge" id="doc-badge">Master Dossier</div>
          <div class="doc-filename" id="doc-filename"></div>
        </div>
        <div class="doc-date" id="doc-date"></div>
      </div>
      <div class="md-body" id="md-body"></div>
    </div>

    <!-- TABLE OF CONTENTS SIDEBAR (STICKY RIGHT) -->
    <nav class="toc-sidebar" id="toc">
      <h5>Contents</h5>
      <div id="toc-links"></div>
    </nav>
  </main>

  <script>
  (function () {
    'use strict';

    /* ── Helpers ── */
    function qs(sel, ctx) { return (ctx || document).querySelector(sel); }
    function qsa(sel, ctx) { return [...(ctx || document).querySelectorAll(sel)]; }

    /* ── Configure mermaid ── */
    if (typeof mermaid !== 'undefined') {
      try {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          themeVariables: {
            darkMode: true,
            background: '#0f2234',
            primaryColor: '#18334B',
            primaryTextColor: '#FAEEE5',
            primaryBorderColor: '#C9B79F',
            lineColor: '#C9B79F',
            secondaryColor: '#566746',
            secondaryTextColor: '#FAEEE5',
            secondaryBorderColor: '#C9B79F',
            tertiaryColor: '#152d42',
            tertiaryTextColor: '#FAEEE5',
            tertiaryBorderColor: '#C9B79F',
            fontFamily: "'Manrope', system-ui, sans-serif",
            fontSize: '12px'
          }
        });
      } catch (e) {
        console.warn('Mermaid initialization warning:', e);
      }
    }

    /* ── Configure marked ── */
    if (typeof marked !== 'undefined' && marked.setOptions) {
      marked.setOptions({
        gfm: true,
        breaks: false,
        highlight: function (code, lang) {
          if (lang === 'mermaid') {
            return code;
          }
          if (typeof hljs !== 'undefined') {
            if (lang && hljs.getLanguage && hljs.getLanguage(lang)) {
              try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
            }
            if (hljs.highlightAuto) {
              try { return hljs.highlightAuto(code).value; } catch (e) {}
            }
          }
          return code;
        }
      });
    }

    /* ── Read ?file= param ── */
    var params = new URLSearchParams(window.location.search);
    var filePath = params.get('file'); // e.g. master-dossiers/MasterDossier-Domain1-...md

    if (!filePath) {
      showError('No <code>?file=</code> parameter provided. Please link here with <code>?file=master-dossiers/YourDossier.md</code>');
      return;
    }

    /* ── Fetch the markdown file ── */
    fetch('../' + filePath)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + filePath);
        return res.text();
      })
      .then(function (md) {
        renderDoc(md, filePath);
      })
      .catch(function (err) {
        showError('Could not load <code>' + filePath + '</code>.<br>Make sure the file exists in your portfolio directory and you are running this via a local server.<br><em>Error: ' + err.message + '</em>');
      });

    /* ── Strip internal prep sections (Loom scripts & Grill Me FAQs) for recruiters ── */
    function stripInternalSections(rawMd) {
      var forbiddenPatterns = [
        /##\s*.*loom/i,
        /##\s*.*(grill\s*me|recruiter.*faq|recruiter.*q&a|interview.*prep)/i,
        /##\s*.*(presentation\s*guide|defense\s*script)/i
      ];

      var lines = rawMd.split('\n');
      var output = [];
      var skipping = false;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var isH2 = /^##\s+/.test(line);
        var isH1 = /^#\s+/.test(line);

        if (isH2 || isH1) {
          var matchesForbidden = forbiddenPatterns.some(function (rx) {
            return rx.test(line);
          });

          if (matchesForbidden) {
            skipping = true;
            // Remove previous trailing horizontal divider if present
            if (output.length > 0 && output[output.length - 1].trim() === '---') {
              output.pop();
            }
            continue;
          } else {
            skipping = false;
          }
        }

        if (!skipping) {
          output.push(line);
        }
      }

      return output.join('\n');
    }

    /* ── Render document ── */
    function renderDoc(md, filePath) {
      // Filter out internal interview prep sections by default (unless ?prep=true in URL)
      var showInternal = params.get('prep') === 'true' || params.get('mode') === 'internal';
      if (!showInternal) {
        md = stripInternalSections(md);
      }

      // Parse filename for metadata
      var filename = filePath.split('/').pop() || filePath;
      var title = filename.replace(/\.md$/i, '').replace(/[-_]/g, ' ');
      var domain = detectDomain(filePath, filename);
      var today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      // Apply GitHub-style alert blockquote classes
      var html = marked.parse(md);
      html = html.replace(/<blockquote>\s*<p>\[!CAUTION\]/gi,     '<blockquote class="alert-caution"><p>⛔ <strong>CAUTION</strong>');
      html = html.replace(/<blockquote>\s*<p>\[!WARNING\]/gi,      '<blockquote class="alert-warning"><p>⚠️ <strong>WARNING</strong>');
      html = html.replace(/<blockquote>\s*<p>\[!IMPORTANT\]/gi,    '<blockquote class="alert-important"><p>❗ <strong>IMPORTANT</strong>');
      html = html.replace(/<blockquote>\s*<p>\[!NOTE\]/gi,         '<blockquote><p>📝 <strong>NOTE</strong>');
      html = html.replace(/<blockquote>\s*<p>\[!TIP\]/gi,          '<blockquote class="alert-tip"><p>💡 <strong>TIP</strong>');

      // Inject
      qs('#md-body').innerHTML = html;

      // Transform language-mermaid code blocks into .mermaid containers
      var mermaidBlocks = qsa('pre code.language-mermaid', qs('#md-body'));
      mermaidBlocks.forEach(function (codeBlock, idx) {
        var pre = codeBlock.parentElement;
        var rawCode = codeBlock.textContent.trim();
        var wrap = document.createElement('div');
        wrap.className = 'mermaid-wrap';
        var mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.id = 'mermaid-diagram-' + idx;
        mermaidDiv.textContent = rawCode;
        wrap.appendChild(mermaidDiv);
        pre.parentNode.replaceChild(wrap, pre);
      });

      // Render mermaid diagrams
      if (typeof mermaid !== 'undefined' && mermaidBlocks.length > 0) {
        try {
          if (typeof mermaid.run === 'function') {
            mermaid.run({ querySelector: '.mermaid' }).catch(function (e) {
              console.warn('Mermaid render warning:', e);
            });
          } else if (typeof mermaid.init === 'function') {
            mermaid.init(undefined, qsa('.mermaid'));
          }
        } catch (mErr) {
          console.warn('Mermaid execution warning:', mErr);
        }
      }

      // Run highlight.js on any remaining unhighlighted blocks (defensively)
      if (typeof hljs !== 'undefined' && hljs.highlightElement) {
        qsa('pre code', qs('#md-body')).forEach(function (block) {
          if (!block.classList.contains('hljs') && !block.classList.contains('language-mermaid')) {
            try { hljs.highlightElement(block); } catch (e) {}
          }
        });
      }

      // Set UI metadata (use markdown H1 title if available)
      var firstH1 = qs('h1', qs('#md-body'));
      var displayTitle = (firstH1 && firstH1.textContent.trim()) ? firstH1.textContent.trim() : title;
      qs('#topbar-title').textContent = displayTitle;
      qs('#doc-badge').textContent = domain;
      qs('#doc-filename').textContent = filename;
      qs('#doc-date').textContent = 'Viewed: ' + today;
      qs('#print-doc-title').textContent = displayTitle;
      qs('#print-url').textContent = window.location.href;
      document.title = displayTitle + ' — Riovic Matthew G. Susas';

      // Build TOC from h2/h3
      buildToc();

      // Show document, hide loading
      qs('#loading').style.display = 'none';
      qs('#doc-wrap').style.display = 'block';

      // Copy link button
      qs('#btn-copy').addEventListener('click', function () {
        var url = window.location.href;
        navigator.clipboard.writeText(url).then(function () {
          var btn = qs('#btn-copy');
          var orig = btn.innerHTML;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
          btn.style.color = '#a3b896';
          setTimeout(function () { btn.innerHTML = orig; btn.style.color = ''; }, 2000);
        });
      });

      // Scroll-spy for TOC
      initScrollSpy();
    }

    /* ── Build table of contents ── */
    function buildToc() {
      var body = qs('#md-body');
      var headings = qsa('h2, h3', body);
      var tocEl = qs('#toc-links');
      var fragment = document.createDocumentFragment();
      var idx = 0;

      headings.forEach(function (h) {
        // Give each heading an id
        if (!h.id) {
          h.id = 'section-' + (idx++);
        }
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent.replace(/^[\d.]+\s*/, ''); // strip leading numbers
        if (h.tagName === 'H3') a.classList.add('toc-h3');
        a.addEventListener('click', function (e) {
          e.preventDefault();
          document.getElementById(h.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        fragment.appendChild(a);
      });

      tocEl.appendChild(fragment);
      if (headings.length === 0) qs('#toc').style.display = 'none';
    }

    /* ── Scroll-spy ── */
    function initScrollSpy() {
      var links = qsa('#toc-links a');
      if (!links.length) return;

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var id = entry.target.id;
          var link = qs('#toc-links a[href="#' + id + '"]');
          if (!link) return;
          if (entry.isIntersecting) {
            links.forEach(function (l) { l.classList.remove('active'); });
            link.classList.add('active');
          }
        });
      }, { rootMargin: '-64px 0px -80% 0px' });

      qsa('h2, h3', qs('#md-body')).forEach(function (h) { observer.observe(h); });
    }

    /* ── Domain badge from filename ── */
    function detectDomain(filePath, filename) {
      var str = (filePath + ' ' + filename).toLowerCase();
      if (str.indexOf('capstone') !== -1) return '★ Capstone — Cross-Domain';
      if (str.indexOf('domain-1') !== -1 || str.indexOf('domain1') !== -1 || str.indexOf('order-lifecycle') !== -1 || str.indexOf('orderexception') !== -1 || str.indexOf('pointofnoreturn') !== -1) return 'Domain 1 — Order Lifecycle';
      if (str.indexOf('domain-2') !== -1 || str.indexOf('domain2') !== -1 || str.indexOf('order-routing') !== -1 || str.indexOf('routingengine') !== -1 || str.indexOf('multilocation') !== -1) return 'Domain 2 — Routing & Logistics';
      if (str.indexOf('domain-3') !== -1 || str.indexOf('domain3') !== -1 || str.indexOf('bulk-data') !== -1 || str.indexOf('catalog') !== -1 || str.indexOf('matrixify') !== -1) return 'Domain 3 — Bulk Catalog Governance';
      if (str.indexOf('domain-4') !== -1 || str.indexOf('domain4') !== -1 || str.indexOf('business-automation') !== -1 || str.indexOf('webhook') !== -1 || str.indexOf('flow') !== -1) return 'Domain 4 — Business Automations';
      if (str.indexOf('domain-5') !== -1 || str.indexOf('domain5') !== -1 || str.indexOf('technical-diagnosis') !== -1 || str.indexOf('discount') !== -1 || str.indexOf('cartdiagnostics') !== -1) return 'Domain 5 — Technical Diagnosis';
      if (str.indexOf('domain-6') !== -1 || str.indexOf('domain6') !== -1 || str.indexOf('frontline-helpdesk') !== -1 || str.indexOf('helpdesk') !== -1 || str.indexOf('macro') !== -1) return 'Domain 6 — Frontline Helpdesk';
      return 'Master Technical Dossier';
    }

    /* ── Error state ── */
    function showError(msg) {
      qs('#loading').style.display = 'none';
      var errEl = qs('#error');
      errEl.style.display = 'flex';
      qs('#error-msg').innerHTML = msg;
    }

  })();
  </script>
</body>
</html>
