# ════════════════════════════════════════════════════════
#  GitHub Pages — Auto-Deploy Portfolio on every push
#  Deploys the static portfolio site to GitHub Pages.
# ════════════════════════════════════════════════════════

name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main          # fires on every push to main
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Keep rerun attempts separate from artifacts left by earlier attempts.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '.'   # Root of repository

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
