# ════════════════════════════════════════════════════════
#  Verify every branch push and deploy main to GitHub Pages.
# ════════════════════════════════════════════════════════

name: Verify Portfolio and Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Offline Verification Harness
        run: |
          node evidence/test_report_accounting.js
          node evidence/run_all.js

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Start from the commit so generated evidence from CI stays out of Pages.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Keep rerun attempts separate from artifacts left by earlier attempts.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '.'   # Root of repository

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
