<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Riovic Matthew G. Susas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="fullwidth-layout">
  <a href="../" class="homepage-back-link">
    <span aria-hidden="true">&larr;</span> Back to homepage
  </a>

  <!-- MAIN SCROLLER -->
  <main class="main" id="mainContent">

<div class="page active" id="page-contact">
      <div class="section-header"><h2>Contact</h2><p>Ready to work together? Let's talk.</p></div>
      <div class="contact-layout">
        <div class="contact-info">
          <h3>Let's build something great.</h3>
          <p>Whether it's a full Shopify store buildout or a quick automation fix — I'd love to hear what you're working on.</p>
          <div class="contact-link-row"><i class="ph ph-facebook-logo"></i> Facebook — TBA</div>
          <div class="contact-link-row"><i class="ph ph-linkedin-logo"></i> LinkedIn — TBA</div>
          <div class="contact-link-row"><i class="ph ph-discord-logo"></i> Discord — TBA</div>
          <div class="contact-link-row"><i class="ph ph-briefcase"></i> Upwork — TBA</div>
        </div>
        <div class="contact-form">
          <h3>Send a Message</h3>
          <div class="form-group"><label>Your Name</label><input type="text" placeholder="John Doe" /></div>
          <div class="form-group"><label>Email Address</label><input type="email" placeholder="john@example.com" /></div>
          <div class="form-group"><label>Message</label><textarea placeholder="Tell me about your project..."></textarea></div>
          <button class="form-submit"><i class="ph ph-paper-plane-tilt"></i> Send Message</button>
        </div>
      </div>
    </div>

  </main>

  <script src="../js/main.js"></script>
</body>
</html>
