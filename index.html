  <link rel="stylesheet" href="assets/hero/hero.css" />

  <!-- Prevent theme flicker on initial load -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('portfolio-theme');
      if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
