<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latest Updates &amp; Engineering Activity — Riovic Matthew G. Susas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="fullwidth-layout">
  <!-- GLOBAL SITE HEADER -->
  <header class="site-header">
    <a href="../" class="site-logo">
      <span class="site-logo-dot"></span>
      <span>Riovic Matthew</span>
    </a>
    <nav class="site-nav">
      <a href="../" class="site-nav-link"><i class="ph ph-house-simple"></i> Home</a>
      <a href="../projects/" class="site-nav-link"><i class="ph ph-folder-open"></i> Projects</a>
      <a href="../about/" class="site-nav-link"><i class="ph ph-user-circle"></i> About Me</a>
      <a href="../testimonials/" class="site-nav-link"><i class="ph ph-chat-circle-dots"></i> Testimonials</a>
      <a href="../latest/" class="site-nav-link active"><i class="ph ph-newspaper"></i> Latest</a>
      <a href="../contact/" class="site-nav-link"><i class="ph ph-paper-plane-tilt"></i> Contact</a>
    </nav>
    <div class="site-header-actions">
      <button class="theme-toggle-btn-header" id="themeToggleBtn" aria-label="Toggle light or dark theme" title="Toggle Light/Dark Theme">
        <span class="theme-toggle-indicator">
          <i class="ph ph-moon" id="themeIconDark"></i>
          <i class="ph ph-sun" id="themeIconLight" style="display:none;"></i>
        </span>
        <span class="theme-toggle-text" id="themeToggleText">Dark</span>
      </button>
    </div>
  </header>

  <!-- MAIN SCROLLER -->
  <main class="main" id="mainContent">

    <div class="page active" id="page-latest">
      <div class="section-header" style="text-align:center; max-width:800px; margin: 0 auto 32px;">
        <h2>Latest Updates &amp; Engineering Activity Log</h2>
        <p>Continuous operational deployments, automation rollouts, and forensic post-mortems across Shopify Plus, 3PL WMS, and Carrier APIs. Click any update for an executive overview.</p>
      </div>

      <!-- TIMELINE CONTAINER -->
      <div class="latest-timeline" id="fullTimeline"></div>
    </div>

  </main>

  <!-- QUICK OVERVIEW MODAL POPUP -->
  <div class="latest-modal-overlay" id="latestModalOverlay" role="dialog" aria-modal="true" aria-hidden="true" onclick="handleModalBackdropClick(event)">
    <div class="latest-modal-sheet" id="latestModalSheet" onclick="event.stopPropagation()">
      <div id="modalDynamicContent"></div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script src="../js/feed-data.js"></script>
  <script>
    let currentFeed = [];

    document.addEventListener('DOMContentLoaded', () => {
      currentFeed = getFeed();
      const container = document.getElementById('fullTimeline');
      if (!container || !currentFeed) return;

      container.innerHTML = currentFeed.map(item => `
        <article class="timeline-card" onclick="openLatestModal('${item.id}')" tabindex="0" role="button" aria-label="View quick overview for ${item.title}">
          <div class="timeline-meta">
            <span class="timeline-date"><i class="ph ph-calendar-blank"></i> ${item.date}</span>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="timeline-tag"><i class="ph ${item.icon || 'ph-sparkle'}"></i> ${item.tag}</span>
            </div>
          </div>
          <h3 class="timeline-title">${item.title}</h3>
          <p class="timeline-text">${item.short}</p>
          <div class="timeline-card-actions">
            <button class="timeline-quickview-btn" onclick="event.stopPropagation(); openLatestModal('${item.id}')">
              <i class="ph ph-eye"></i> Quick Overview
            </button>
            <a href="../projects/?id=${item.projectId}" class="timeline-case-link" onclick="event.stopPropagation()">
              View Case Study <i class="ph ph-arrow-right"></i>
            </a>
          </div>
        </article>
      `).join('');
    });

    // OPEN QUICK OVERVIEW MODAL
    function openLatestModal(id) {
      const item = currentFeed.find(x => x.id === id);
      if (!item) return;

      const content = document.getElementById('modalDynamicContent');
      const overlay = document.getElementById('latestModalOverlay');
      if (!content || !overlay) return;

      content.innerHTML = `
        <div class="modal-header-top">
          <div class="modal-header-left">
            <div class="modal-domain-icon">
              <i class="ph ${item.icon || 'ph-cpu'}"></i>
            </div>
            <div class="modal-title-area">
              <div class="modal-badges-row">
                <span class="modal-pill-tag">${item.domain}</span>
                <span class="modal-pill-tag" style="background:rgba(201,183,159,0.15); border-color:var(--warm1);">${item.date}</span>
              </div>
              <h2 style="margin-top:6px;">${item.title}</h2>
            </div>
          </div>
          <button class="modal-close-btn" onclick="closeLatestModal()" aria-label="Close modal">
            <i class="ph ph-x"></i>
          </button>
        </div>

        <!-- PROBLEM & ROOT CAUSE -->
        <div class="modal-section-block">
          <div class="modal-section-heading">
            <i class="ph ph-warning-circle" style="color:#E57373;"></i> Operational Problem &amp; Root Cause
          </div>
          <p class="modal-section-paragraph">${item.problem}</p>
        </div>

        <!-- ENGINEERED SOLUTION & SAFEGUARD -->
        <div class="modal-section-block">
          <div class="modal-section-heading">
            <i class="ph ph-shield-check" style="color:var(--hunter);"></i> Engineered Solution &amp; Governance
          </div>
          <p class="modal-section-paragraph">${item.solution}</p>
        </div>

        <!-- IMPACT & VERIFICATION METRICS -->
        <div class="modal-section-block">
          <div class="modal-section-heading">
            <i class="ph ph-chart-line-up" style="color:var(--isabelline);"></i> Key Outcomes &amp; Measurable Verification
          </div>
          <div class="modal-metrics-grid">
            ${item.metrics.map(m => `
              <div class="modal-metric-card">
                <div class="modal-metric-val">${m.val}</div>
                <div class="modal-metric-label">${m.label}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- TECH STACK -->
        <div class="modal-section-block" style="margin-bottom:12px;">
          <div class="modal-section-heading">
            <i class="ph ph-stack" style="color:var(--muted);"></i> Technical Stack &amp; Protocols
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            ${item.tags.map(t => `<span class="modal-pill-tag">${t}</span>`).join('')}
          </div>
        </div>

        <!-- MODAL FOOTER ACTIONS -->
        <div class="modal-actions-footer">
          <a href="../projects/?id=${item.projectId}" class="modal-primary-cta">
            <i class="ph ph-book-open"></i> View In-Depth Case Study &amp; Technical Defense <i class="ph ph-arrow-right"></i>
          </a>
          <button class="modal-secondary-cta" onclick="closeLatestModal()">
            Close Overview
          </button>
        </div>
      `;

      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    // CLOSE MODAL
    function closeLatestModal() {
      const overlay = document.getElementById('latestModalOverlay');
      if (overlay) {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
      }
      document.body.style.overflow = '';
    }

    // BACKDROP CLICK
    function handleModalBackdropClick(event) {
      if (event.target.id === 'latestModalOverlay') {
        closeLatestModal();
      }
    }

    // KEYBOARD ESCAPE TO CLOSE
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLatestModal();
      }
    });
  </script>
</body>
</html>
