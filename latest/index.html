<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latest Updates & What's New — Riovic Matthew G. Susas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="fullwidth-layout">
  <!-- GLOBAL SITE HEADER -->
  <header class="site-header">
    <a href="../" class="site-logo">
      <span class="site-logo-dot"></span>
      <span>Riovic Matthew</span>
    </a>
    <nav class="site-nav">
      <a href="../" class="site-nav-link"><i class="ph ph-house-simple"></i> Home</a>
      <a href="../projects/" class="site-nav-link"><i class="ph ph-folder-open"></i> Projects</a>
      <a href="../about/" class="site-nav-link"><i class="ph ph-user-circle"></i> About Me</a>
      <a href="../testimonials/" class="site-nav-link"><i class="ph ph-chat-circle-dots"></i> Testimonials</a>
      <a href="../latest/" class="site-nav-link active"><i class="ph ph-newspaper"></i> Latest</a>
      <a href="../contact/" class="site-nav-link"><i class="ph ph-paper-plane-tilt"></i> Contact</a>
    </nav>
    <div class="site-header-actions">
      <button class="theme-toggle-btn-header" id="themeToggleBtn" aria-label="Toggle light or dark theme" title="Toggle Light/Dark Theme">
        <span class="theme-toggle-indicator">
          <i class="ph ph-moon" id="themeIconDark"></i>
          <i class="ph ph-sun" id="themeIconLight" style="display:none;"></i>
        </span>
        <span class="theme-toggle-text" id="themeToggleText">Dark</span>
      </button>
    </div>
  </header>

  <!-- MAIN SCROLLER -->
  <main class="main" id="mainContent">

    <div class="page active" id="page-latest">
      <div class="section-header">
        <h2>Latest Updates &amp; Activity Log</h2>
        <p>Continuous operational deployments, automation rollouts, and engineering postmortems.</p>
      </div>

      <div class="latest-timeline" id="fullTimeline"></div>
    </div>

  </main>

  <script src="../js/main.js"></script>
  <script src="../js/feed-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const feed = getFeed();
      const container = document.getElementById('fullTimeline');
      if (container && feed) {
        // Expanded feed with richer activity descriptions
        const richFeed = [
          ...feed,
          {
            id: 5,
            date: 'Jun 2026',
            text: 'Completed Synapse Botanicals enterprise simulation architecture — published full 24-SKU matrix, bi-coastal logistics waterfalls, and capstone webhook failure postmortem.',
            tag: 'Architecture Spec',
            link: 'projects.html?id=c1-async-mutation'
          },
          {
            id: 6,
            date: 'Jun 2026',
            text: 'Published Master SOP for Bulk Catalog Mutation and Google Sheets IEEE 754 floating-point barcode preservation protocol.',
            tag: 'Data Governance',
            link: 'projects.html?id=d3-bulk-catalog-sop'
          }
        ];

        container.innerHTML = richFeed.map(item => `
          <div class="timeline-card">
            <div class="timeline-meta">
              <span class="timeline-date"><i class="ph ph-calendar-blank"></i> ${item.date}</span>
              <span class="timeline-tag">${item.tag}</span>
            </div>
            <p class="timeline-text">${item.text}</p>
            ${item.link ? `<a href="${item.link}" class="timeline-link">View Documentation <i class="ph ph-arrow-right"></i></a>` : ''}
          </div>
        `).join('');
      }
    });
  </script>
  <script src="../js/theme-toggle.js"></script>
</body>
</html>
